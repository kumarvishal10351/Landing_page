<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0e0f">

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">

  <!-- Stylesheet -->

<body>

  <!-- ======================================================================
       1. TIMER SCREEN (1.5-SECOND COUNTDOWN)
       Displays photo, bold heading, 1.5s countdown, and disclaimer.
       Layered on top of the fullscreen video (z-index: 1000).
       ====================================================================== -->
  <div id="timerScreen" class="timer-screen" role="status" aria-live="polite">
    <div class="timer-card" id="timerCard">
      <div class="timer-avatar-container">
        <img 
          src="assets/profile.jpg" 
          alt="BITTU BHAI" 
          class="timer-avatar" 
          width="74" 
          height="74"
          loading="eager"
        >
        <svg class="timer-svg" viewBox="0 0 100 100" aria-hidden="true">
          <circle class="timer-svg-bg" cx="50" cy="50" r="44"></circle>
          <circle id="timerSvgCircle" class="timer-svg-bar" cx="50" cy="50" r="44"></circle>
        </svg>
      </div>

      <!-- Bold Text -->
      <h2 class="timer-bold-title">JOIN OUR PROFITABLE CHANNEL NOW</h2>

      <!-- Countdown Box -->
      <div class="timer-countdown-box">
        <span id="countdownNumber" class="countdown-digit">1</span>
      </div>

      <p class="timer-subtext">Opening page in <span id="timerSecondsText">1.5</span> seconds...</p>

      <div class="timer-progress-track">
        <div id="timerProgressBar" class="timer-progress-fill"></div>
      </div>

      <!-- Small Disclaimer Text -->
      <p class="timer-disclaimer">It's only for entainment purpose I will not engage in any financial losses.</p>

      <button id="skipTimerBtn" class="timer-skip-btn" type="button" aria-label="Skip timer and open immediately">
        Skip &rarr;
      </button>
    </div>
  </div>

  <!-- ======================================================================
       2. FULLSCREEN VIDEO CONTAINER
       Rendered immediately from start (z-index: 100) to allow mobile hardware
       video decoder to autoplay immediately without being blocked.
       ====================================================================== -->
  <main id="videoScreen" class="fullscreen-video-container">

    <!-- Fullscreen Video: autoplay, muted, playsinline guaranteed to play on all mobile devices -->
    <video 
      id="promoVideo" 
      class="fullscreen-video" 
      src="assets/video.mp4" 
      autoplay 
      muted 
      loop
      playsinline 
      webkit-playsinline
      x5-playsinline
      x5-video-player-type="h5-page"
      x5-video-player-fullscreen="true"
      disablePictureInPicture
      controlsList="nodownload noplaybackrate nofullscreen"
      preload="auto"
    ></video>

    <!-- Tap Area Over Video to ensure unmuting on tap without unwanted redirect -->
    <div id="videoTapOverlay" class="video-tap-overlay" aria-label="Fullscreen video player"></div>

    <!-- Top Floating Telegram Header Overlay -->
    <header class="video-top-overlay">
      <a href="https://t.me/+Gy66WGS85nc4Yzhl" class="video-channel-pill" target="_blank" rel="noopener noreferrer">
        <img 
          src="assets/profile.jpg" 
          alt="BITTU BHAI" 
          class="video-header-avatar"
          width="42"
          height="42"
        >
        <div class="video-header-meta">
          <span class="video-header-title">BITTU BHAI NUMBER PRIDICTION</span>
          <span class="video-header-subs">41 288 subscribers &bull; VIP Signals</span>
        </div>
      </a>
    </header>

    <!-- Bottom Floating CTA Overlay -->
    <div class="video-bottom-overlay">
      <a 
        id="joinChannelBtn"
        href="https://t.me/+Gy66WGS85nc4Yzhl" 
        class="btn-join" 
        target="_blank" 
        rel="noopener noreferrer"
      >
        JOIN CHANNEL
      </a>

      <p class="video-disclaimer">It's only for entainment purpose I will not engage in any financial losses.</p>
    </div>

  </main>

  <!-- ======================================================================
       AUTOMATION SCRIPT:
       1. 1.5-second countdown timer
       2. Video autoplays instantly on mobile (never paused)
       3. Audio safely probes unmuting & un-mutes automatically on any gesture
       4. Fullscreen video covering entire screen
       5. Auto-redirect on video completion to Telegram link
       6. Direct navigation on JOIN CHANNEL button
       ====================================================================== -->
  <script>
    const COUNTDOWN_SECONDS = 1.5;
    const TELEGRAM_URL = 'https://t.me/+Gy66WGS85nc4Yzhl';

    (function() {
      const timerScreen = document.getElementById('timerScreen');
      const promoVideo = document.getElementById('promoVideo');
      const videoTapOverlay = document.getElementById('videoTapOverlay');
      const countdownNumber = document.getElementById('countdownNumber');
      const timerSecondsText = document.getElementById('timerSecondsText');
      const timerProgressBar = document.getElementById('timerProgressBar');
      const timerSvgCircle = document.getElementById('timerSvgCircle');
      const skipBtn = document.getElementById('skipTimerBtn');

      let hasOpened = false;
      const circumference = 2 * Math.PI * 44;

      if (timerSvgCircle) {
        timerSvgCircle.style.strokeDasharray = circumference;
        timerSvgCircle.style.strokeDashoffset = '0';
      }

      // Step 1: Ensure video starts playing immediately on load
      // Keep muted=true initially so mobile browsers NEVER pause the video!
      if (promoVideo) {
        promoVideo.muted = true;
        const playPromise = promoVideo.play();
        if (playPromise !== undefined) {
          playPromise.catch(function() {
            promoVideo.muted = true;
            promoVideo.play().catch(function() {});
          });
        }
      }

      // Step 2: Safe unmuting function
      // If unmuting succeeds, sound is on! If blocked, immediately reverts to muted so video NEVER freezes!
      function safelyUnmute() {
        if (!promoVideo) return;
        promoVideo.muted = false;
        promoVideo.volume = 1.0;

        const p = promoVideo.play();
        if (p !== undefined) {
          p.catch(function() {
            // If browser blocks unmuted playback, immediately restore muted to keep video playing!
            promoVideo.muted = true;
            promoVideo.play().catch(function() {});
          });
        }
      }

      // Step 3: Web Audio API unlocker on any interaction
      let audioCtx = null;
      function unlockAudio() {
        try {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass && !audioCtx) {
            audioCtx = new AudioContextClass();
          }
          if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
          }
        } catch (e) {}

        safelyUnmute();
      }

      // Attach universal gesture listeners to unlock sound at the first touch anywhere
      ['touchstart', 'touchend', 'click', 'pointerdown', 'mousedown', 'keydown', 'scroll'].forEach(function(evt) {
        window.addEventListener(evt, unlockAudio, { passive: true });
        document.addEventListener(evt, unlockAudio, { passive: true });
      });

      // Tapping the video screen un-mutes without navigating away
      if (videoTapOverlay) {
        videoTapOverlay.addEventListener('click', unlockAudio);
        videoTapOverlay.addEventListener('touchstart', unlockAudio, { passive: true });
      }

      if (promoVideo) {
        promoVideo.addEventListener('click', unlockAudio);
        promoVideo.addEventListener('touchstart', unlockAudio, { passive: true });

        // Redirect to Telegram when video ends
        promoVideo.addEventListener('ended', function() {
          window.location.href = TELEGRAM_URL;
        });
      }

      // Safe audio probe: test if browser allows unmuted autoplay without risking pausing the video
      try {
        const probe = new Audio();
        probe.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
        probe.volume = 0.01;
        const probePromise = probe.play();
        if (probePromise !== undefined) {
          probePromise.then(function() {
            // Browser allows unmuted autoplay! Safely unmute promoVideo
            promoVideo.muted = false;
            promoVideo.volume = 1.0;
          }).catch(function() {
            // Browser requires touch for sound. promoVideo stays playing muted.
          });
        }
      } catch (e) {}

      function openFullscreenVideo() {
        if (hasOpened) return;
        hasOpened = true;

        if (timerScreen) {
          timerScreen.classList.add('fade-out');
          setTimeout(function() {
            timerScreen.style.display = 'none';
          }, 350);
        }

        // Try unmuting when timer completes
        safelyUnmute();
      }

      // Allow skip button to trigger video immediately
      if (skipBtn) {
        skipBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          unlockAudio();
          openFullscreenVideo();
        });
      }

      // Tapping anywhere on the timer screen also unlocks audio immediately
      if (timerScreen) {
        timerScreen.addEventListener('click', function() {
          unlockAudio();
        });
      }

      // Start circular SVG ring and progress bar animations for 1.5 seconds
      requestAnimationFrame(function() {
        if (timerProgressBar) {
          timerProgressBar.style.transition = 'width ' + COUNTDOWN_SECONDS + 's linear';
          timerProgressBar.style.width = '100%';
        }

        if (timerSvgCircle) {
          timerSvgCircle.style.transition = 'stroke-dashoffset ' + COUNTDOWN_SECONDS + 's linear';
          timerSvgCircle.style.strokeDashoffset = circumference;
        }
      });

      // 1.5-second countdown logic
      const startTime = Date.now();
      const durationMs = COUNTDOWN_SECONDS * 1000;

      const interval = setInterval(function() {
        const elapsed = Date.now() - startTime;
        const leftSec = Math.max(0, (durationMs - elapsed) / 1000);

        if (leftSec > 0.05) {
          if (countdownNumber) {
            const displayVal = Math.ceil(leftSec);
            if (countdownNumber.textContent !== String(displayVal)) {
              countdownNumber.textContent = displayVal;
              countdownNumber.classList.remove('pulse');
              void countdownNumber.offsetWidth;
              countdownNumber.classList.add('pulse');
            }
          }
          if (timerSecondsText) {
            timerSecondsText.textContent = leftSec.toFixed(1);
          }
        } else {
          clearInterval(interval);
          if (countdownNumber) countdownNumber.textContent = '0';
          if (timerSecondsText) timerSecondsText.textContent = '0';
          openFullscreenVideo();
        }
      }, 100);
    })();
  </script>

</body>
</html>
